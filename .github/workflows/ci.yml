# The full gate chain in one job, one clean checkout, no artifact caching
# (Story 1.8's own AC line — a cache could mask a determinism or
# tuist-generate-cleanliness regression that a from-scratch run would catch).
# A later story's CI gate extends this job rather than adding a new
# workflow file.
name: CI

on:
  pull_request:

# A fixup push to an open PR should replace the in-flight run for that PR,
# not queue a second full macOS job behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    timeout-minutes: 30
    # mise resolves tool versions against the GitHub releases API; without a
    # token it shares the runner IP's 60/req-hr unauthenticated limit, which
    # this job's own `mise install` step is enough to exhaust on its own.
    # The default GITHUB_TOKEN raises that to 5,000/hr and needs no extra
    # permissions beyond what `permissions: contents: read` already grants.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Xcode version
        id: xcode_version
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode ${{ steps.xcode_version.outputs.version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode_version.outputs.version }}

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain (tuist, swiftformat, swiftlint)
        run: mise install

      # Lint/format first, before any build/test/xcodebuild step: a naming
      # or layout nit should fail in seconds, not after the whole expensive
      # build-test-xcodebuild chain has already run.
      - name: swiftformat --lint
        run: mise exec -- swiftformat --lint .

      - name: swiftlint
        run: mise exec -- swiftlint lint --strict .

      # Every custom_rules regex is a hand-written string with no compiler
      # to catch a typo that silently stops it matching — `swiftlint lint`
      # against the real tree exits 0 identically whether a rule works or
      # is dead, since nothing in the tree matches any of the six patterns
      # outside their own exclusions. This feeds one known-violating
      # one-liner per custom rule through the real .swiftlint.yml and
      # fails if any expected rule id doesn't show up in the output.
      - name: Verify custom_rules still fire (fixture self-check)
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          cat > "$fixture_dir/CustomRuleFixtures.swift" <<'SWIFT'
          import Foundation

          func atomicWriterBypassFixture() {
              _ = FileManager.default.createFile(atPath: "x", contents: nil)
          }

          func logFacadeBypassFixture() {
              os_log("test")
          }

          func transcriptDecodeBypassFixture() {
              _ = try? JSONDecoder().decode(TranscriptPayload.self, from: Data())
          }

          func telemetrySQLBypassFixture() {
              let sql = "INSERT INTO telemetry (meeting_id) VALUES ('x')"
              _ = sql
          }

          func compositionRootStrategyBypassFixture() {
              _ = ClaudeCitationsSummarizer()
          }

          func accessibilityLabelMissingFixture() {
              Button("Save") { }
          }

          struct TranscriptPayload: Decodable {}
          struct ClaudeCitationsSummarizer {}
          struct Button {
              init(_ title: String, action: () -> Void) {}
          }
          SWIFT

          output=$(mise exec -- swiftlint lint --no-cache --config "$GITHUB_WORKSPACE/.swiftlint.yml" --force-exclude "$fixture_dir" || true)
          echo "$output"

          missing=0
          for rule in atomic_writer_bypass log_facade_bypass transcript_decode_bypass telemetry_sql_bypass composition_root_strategy_bypass accessibility_label_missing; do
            if ! echo "$output" | grep -q "($rule)"; then
              echo "::error::Fixture self-check: custom rule '$rule' did not fire against its known-violating fixture — the rule may be dead."
              missing=1
            fi
          done

          rm -rf "$fixture_dir"
          exit "$missing"

      # AR-INIT-2 (Package.swift:1-6): plain `swift build` does not reject an
      # undeclared cross-target import — this flag is what makes the module
      # boundary build-enforced. `swift test` compiles test targets through
      # its own separate build, so it needs the same flag to close the same
      # gap for test-target imports.
      - name: swift build (explicit target dependency import check)
        run: swift build --explicit-target-dependency-import-check error

      # deferred-work.md:41-43: closes the item automating the exact release
      # build already manually run and accepted as sufficient during Story
      # 1.3's review.
      - name: swift build -c release
        run: swift build -c release

      - name: swift test
        run: swift test --explicit-target-dependency-import-check error

      - name: tuist generate
        working-directory: App
        run: mise exec -- tuist generate --no-open

      - name: xcodebuild AuricleApp
        run: xcodebuild -project App/Auricle.xcodeproj -scheme AuricleApp -destination "platform=macOS" build

      - name: xcodebuild auricle-cli
        run: xcodebuild -project App/Auricle.xcodeproj -scheme auricle-cli -destination "platform=macOS" build

      # AR-INIT-4: a committed generated project is a regression — Tuist
      # regenerates App/Auricle.xcodeproj (plus the repo-root workspace and
      # the AuricleKit.xcodeproj SwiftPM preview) from Project.swift on
      # every clone; none of the three is ever hand-committed.
      - name: Fail if a generated Xcode project/workspace is tracked by git
        run: |
          tracked=$(git ls-files | grep -E '\.(xcodeproj|xcworkspace)(/|$)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A Tuist-generated Xcode project/workspace is tracked by git — it must stay gitignored. Tracked paths:"
            echo "$tracked"
            exit 1
          fi

      # The manifest (Project.swift) and the working tree must agree: any
      # diff here means `tuist generate` produced something .gitignore
      # doesn't already account for.
      - name: Fail if tuist generate left a dirty working tree
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::tuist generate left a non-empty git status outside the gitignored project:"
            echo "$dirty"
            exit 1
          fi
