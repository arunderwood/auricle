# The gate chain, split across jobs that run in parallel. Each one calls
# a phase of scripts/check.sh — the same script `make check` runs locally, so
# the two cannot drift apart. A later story's CI gate extends a job here
# rather than adding a new workflow file.
name: CI

on:
  pull_request:
  # A cache entry written by a PR run is scoped to that PR's own ref and is
  # unreachable from every other branch; only a run on the default branch
  # writes one that PRs can restore. Without this trigger every PR would
  # resolve the package graph from cold, which is what the caching below
  # exists to avoid.
  push:
    branches: [main]
  # A retargeted stacked PR can end up with no run for its new head SHA; this
  # produces one against the branch without closing and reopening the PR.
  workflow_dispatch:

concurrency:
  # A fixup push to an open PR should replace that PR's in-flight run. A push
  # to main must not be cancelled: an interrupted run saves no cache, and main
  # is the only thing that populates the cache PRs restore from.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Pinned rather than macos-latest: .xcode-version pins Xcode 26.4.1, and a
    # runner image that has moved on no longer carries it. The pairing has to
    # be updated deliberately, not discovered through a red build.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # $/ resolves to this repository at the commit that is running, so a
      # step that writes to the workspace cannot substitute the action.
      - uses: $/.github/actions/setup-build-env

      - run: scripts/check.sh lint

  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toolchain
        uses: $/.github/actions/setup-build-env

      # SwiftPM's shared fetch cache, and nothing else. It holds the bare
      # mirrors every resolve would otherwise clone from GitHub, which is the
      # part that costs ~45s; rebuilding .build/checkouts from these mirrors
      # is local and takes about ten seconds, so caching those too would add
      # ~580MB to restore for almost no gain. No build product is cached, so
      # a stale object file can never outlive the source it came from, and
      # the path is outside the working tree, so neither git-hygiene check in
      # the app job can be weakened by a restore. Package.resolved is the
      # exact input that decides the contents; the Xcode version is in the
      # key because the toolchain owns the layout.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-

      - run: scripts/check.sh swift

  # The release build catches optimizer-level breakage only, which does not
  # need to gate every fixup push to an open PR, so it runs on main alone.
  # It is a job rather than a step after `swift` because both compile the whole
  # package and are CPU-bound: on one 3-vCPU runner they can only run back to
  # back, and on separate runners they overlap.
  release:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toolchain
        uses: $/.github/actions/setup-build-env

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-

      - run: scripts/check.sh release

  app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toolchain
        uses: $/.github/actions/setup-build-env

      # Xcode and Tuist read the same shared fetch cache SwiftPM writes, so
      # this is the same entry the swift and release jobs use, under the same
      # key — whichever job finishes first saves it and the others log that it
      # already exists. This is what keeps `tuist generate`'s package
      # resolution off the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode-version }}-

      - run: scripts/check.sh app

      # AR-INIT-4: a committed generated project is a regression — Tuist
      # regenerates App/Auricle.xcodeproj (plus the workspace beside it and
      # the AuricleKit.xcodeproj SwiftPM preview) from Project.swift on every
      # clone; none of the three is ever hand-committed.
      - name: Fail if a generated Xcode project/workspace is tracked by git
        run: |
          tracked=$(git ls-files | grep -E '\.(xcodeproj|xcworkspace)(/|$)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A Tuist-generated Xcode project/workspace is tracked by git — it must stay gitignored. Tracked paths:"
            echo "$tracked"
            exit 1
          fi

      # The manifest (Project.swift) and the working tree must agree: any diff
      # here means `tuist generate` produced something .gitignore doesn't
      # already account for. CI-only (not in scripts/check.sh): this assumes a
      # clean checkout, true here and never true of a real local working tree
      # mid-change.
      - name: Fail if tuist generate left a dirty working tree
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::tuist generate left a non-empty git status outside the gitignored project:"
            echo "$dirty"
            exit 1
          fi
