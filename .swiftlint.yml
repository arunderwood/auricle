# SwiftLint's built-in naming rules (identifier_name, type_name, etc.) cover
# AR-PAT-1 out of the box — this file only tunes their thresholds to this
# codebase's own established, already-reviewed style, plus the 6 custom_rules
# below for the checks that have no built-in equivalent (AR-PAT-4 helper
# discipline + UX-DR65's accessibilityLabel check).
#
# The custom_rules are plain text/regex matches over tokens — SwiftLint's
# standard mechanism, with no import resolution, type-checking, or semantic
# understanding of what a call actually refers to. They catch a call written
# the way this file expects it to be written; they do not catch a
# semantically identical bypass spelled differently (a type alias standing
# in for a vendor type, SQL assembled via string interpolation instead of a
# single literal, a wrapper function around a banned call). Treat a clean
# `swiftlint lint` as a cheap first-pass tripwire, not a proof of compliance
# — architecture.md's own Enforcement Guidelines already pair this layer
# with a human code-review checklist for exactly what regex can't catch. A
# rule going quietly blind against a real call shape it was meant to guard
# (as `log_facade_bypass` did until it was widened to also match
# `Logger(subsystem:` — the API `Log.swift` itself is actually built on,
# not just the legacy `os_log(` free function) is the standing risk this
# whole mechanism carries; keep scripts/lint-fixtures/CustomLintRuleFixtures.swift
# (verified by scripts/verify-custom-lint-rules.sh, wired into ci.yml) in
# sync with each rule's regex whenever either changes.

excluded:
  - .build
  - .swiftpm
  # core.hooksPath is an absolute path into the main checkout, so this
  # config also governs lint runs triggered from any git worktree — and
  # every worktree's own .build lives under here. `excluded` isn't
  # recursive, so without this entry those nested SPM checkouts (GRDB,
  # WhisperKit, etc., thousands of files) get walked as project sources.
  - .claude/worktrees
  - App/Auricle.xcodeproj
  - AuricleKit.xcodeproj
  - "*.xcworkspace"
  - DerivedData
  - .tuist
  - Derived
  # Deliberately violates every custom_rules entry below — excluded from
  # the normal repo-wide pass; scripts/verify-custom-lint-rules.sh lints it
  # explicitly by path (bypassing this exclusion, since an explicitly
  # named path is linted regardless of `excluded` unless --force-exclude
  # is also passed) to prove each rule still fires.
  - scripts/lint-fixtures

# GRDB's own convention for a write/read closure's database handle
# (`writer.write { db in ... }`) appears dozens of times across Sources/State
# and its tests — `db` is clearer at every call site than a longer name would
# be, so it joins the default `^id$` exception rather than getting flagged
# repo-wide. `to` is Swift API Design Guidelines' own prepositional-label
# convention (AtomicWriter's `write(_:to:)`, the CLI's `run --to <stage>`
# flag) — the guideline this rule exists to enforce is what names it this
# short.
identifier_name:
  excluded:
    - id
    - db
    - to

# RetentionScheduler's `init(stateStore:now:onFired:)` takes a clock-
# injection closure and a completion closure — `now: { fixedNow }` labeled
# plus a trailing `{ timer in ... }` reads clearly at every call site in
# RetentionSchedulerTests.swift; this rule's alternative (labeling both, or
# restructuring the initializer around the test rather than the production
# call sites Story 1.5 already settled) isn't a readability improvement.
disabled_rules:
  - multiple_closures_with_trailing_closure

# `Migration002StageEventsMetadataSchemaVersion` (Sources/State/Migrations)
# follows this repo's own `Migration<NNN>_<Description>` naming convention at
# 45 characters, just past the swiftlint default's 40-character warning
# threshold. Raised, not disabled, so a genuinely oversized type name still
# trips it.
type_name:
  max_length:
    warning: 50
    error: 60

# migration files interleave a `CREATE TABLE` column list with an inline `--`
# comment documenting each column (Sources/State/Migrations) — wrapping those
# would separate the column from its own explanation. Raised past the longest
# line in the current tree (Package.swift:82, 169 chars) with real headroom
# rather than disabled, so runaway lines elsewhere still trip it.
line_length:
  warning: 180
  error: 240

# MigrationTests.swift covers every migration's forward-apply and backfill
# behavior in one file per the "one test target per source target"
# convention (architecture.md Test Organization) rather than splitting by
# migration number, which would fragment a single logical test story. The
# 600-line warning is sized to that file so it can stay whole; it is a raised
# limit, not a disabled one, so every other file is still held to it.
file_length:
  warning: 600
  error: 1000

# `PersistStage.run(meetingID:isRepublish:cacheDirectory:vaultPath:
# meetingsSubdir:stateStore:stageRunner:)` (Sources/Persist/PersistStage.swift)
# is a stage entry point's own specified public signature — 7 caller-resolved
# inputs, none of them naturally groupable without inventing a parameter
# object callers would have to assemble just to call it. Raised past exactly
# that need, with headroom to 9 before erroring, rather than disabled, so a
# genuinely over-parameterized function still trips it.
function_parameter_count:
  warning: 7
  error: 9

# swiftformat's own trailing-comma default (this repo's .swiftformat) adds
# trailing commas wherever Swift 6.3 allows them; this must agree; both
# tools disagreeing on trailing commas would fight every commit.
trailing_comma:
  mandatory_comma: true

custom_rules:
  atomic_writer_bypass:
    name: "AtomicWriter bypass"
    message: >-
      Use AtomicWriter.write(_:to:) instead of a direct filesystem write.
      AtomicWriter is the sole write-temp/fsync/rename primitive (NFR-R1,
      FR36, architecture.md's Atomic-Write Enforcement) — every artifact
      write must go through it so a crash mid-write can never leave a
      partially-written target file on disk.
    # `to(File)?:` because Foundation spells the same write two ways —
    # `write(to:)` takes a URL, `write(toFile:)` a path String — and only
    # the URL spelling was matched, leaving the path spelling a silent way
    # past the primitive.
    regex: '\.write\(to(File)?:|FileManager\(\)\.createFile\(|FileManager\.(default\.)?createFile\('
    match_kinds:
      - identifier
      - keyword
    severity: error
    excluded:
      # The primitive's own implementation.
      - ".*/Sources/Core/AtomicWriter\\.swift$"
      # Simulates a killed-before-rename temp file left on disk — the test
      # exists to exercise AtomicWriter's crash-recovery behavior, so it
      # must write the corrupt state directly rather than through the
      # primitive under test.
      - ".*/Tests/CoreTests/AtomicWriterTests\\.swift$"
      # Write a throwaway executable shell-script fixture for subprocess
      # dispatch tests — a test tool, not a vault/cache artifact, so it
      # sits outside AtomicWriter's domain entirely.
      - ".*/Tests/OrchestratorTests/CrashRecoveryTests\\.swift$"
      - ".*/Tests/OrchestratorTests/SubprocessDispatcherTests\\.swift$"
      # Sets up vault-side state VaultWriter must detect rather than
      # produce itself: a stray file standing in for meetingsSubdir, a
      # same-day filename collision, a leftover temp file from an
      # interrupted prior write. Same rationale as AtomicWriterTests.swift
      # above — the fixture writes the raw state directly, VaultWriter
      # under test never does.
      - ".*/Tests/PersistTests/VaultWriterTests\\.swift$"
      # Writes throwaway `promptDir` override files (valid and
      # invalid-UTF-8) to set up fixture state for
      # SummarizationPromptBuilder's file-resolution tests. The builder
      # only ever reads a `promptDir`, never writes one, so this sits
      # outside AtomicWriter's domain the same way VaultWriterTests.swift's
      # fixture setup does.
      - ".*/Tests/SummarizeTests/PromptBuilderSnapshotTests\\.swift$"
      # Plants a pre-existing "original" vault note and a summary.json
      # fixture directly on disk to exercise PersistStage's re-publish and
      # summary-decode paths — same rationale as VaultWriterTests.swift
      # above.
      - ".*/Tests/PersistTests/PersistStageTests\\.swift$"
      # Plants a file at the meeting's cache-directory path to exercise
      # CacheArtifactWriter's directory-creation failure — same rationale as
      # VaultWriterTests.swift above: the fixture writes the blocking state
      # directly, CacheArtifactWriter under test never does.
      - ".*/Tests/CoreTests/CacheArtifactWriterTests\\.swift$"
      # Builds a throwaway Obsidian vault on disk (thousands of notes for the
      # 10K-file bound, where an fsync per file would dominate the test) for
      # VaultGlossaryBuilder to scan. The builder only ever reads a vault; the
      # fixture stands in for the user's own editing, which no auricle write
      # path is involved in.
      - ".*/Tests/VaultGlossaryTests/VaultFixture\\.swift$"

  log_facade_bypass:
    name: "Log facade bypass"
    message: >-
      Use a `Log` instance (log.debug/info/warn/error) instead of calling
      os_log or constructing an os.Logger directly. `Log` is the sole
      logging entry point (AR-PAT-3, AR-PAT-4) and forces every runtime
      field through `LogSensitivity` tagging — neither a direct os_log call
      nor a direct os.Logger(subsystem:category:) has an equivalent guard.
    # `os_log(` (the legacy free function) is legacy and unused anywhere in
    # this tree today — `Log.swift` itself is built on the modern
    # `Logger(subsystem:category:)` struct API, which the original version
    # of this rule didn't match at all, leaving the facade's own real
    # bypass vector completely unguarded.
    regex: '\bos_log\(|\bLogger\(subsystem:'
    match_kinds:
      - identifier
      - keyword
    severity: error
    excluded:
      - ".*/Sources/Core/Log\\.swift$"

  transcript_decode_bypass:
    name: "Transcript decode bypass"
    message: >-
      Decode transcript JSON only through the canonicalization layer
      (CanonicalTranscript, deferred past Epic 1 per deferred-work.md).
      A direct JSONDecoder().decode(...) on a transcript payload skips the
      NFC/LF/`<Speaker_N>:`/byte-offset normalization later stages and
      quote-grounding depend on being applied uniformly.
    regex: 'JSONDecoder\(\)\.decode\(\s*+(?!\[?CanonicalTranscript\]?\.self\b)[^)]*[Tt]ranscript'
    match_kinds:
      - identifier
      - keyword
    severity: error
    # `CanonicalTranscript.self` (or an array of it) is exempted because it
    # is the correct decode *target* for a transcript payload, not because
    # decoding alone performs normalization: the type (Story 3.1, Sources/
    # Core/CanonicalTranscript.swift) is a bare Codable struct today — NFC/
    # LF enforcement and offset validation are still Story 3.5's scope.
    # `\s*+` is possessive, not greedy-with-backtracking: a plain `\s*`
    # lets the engine give back one whitespace character when the lookahead
    # blocks it at the fully-consumed position, after which `[^)]*` can
    # walk back in and match the "Transcript" that is itself a substring of
    # "CanonicalTranscript" — silently defeating the exemption on any
    # multi-line call. Possessive `\s*+` never gives characters back, so the
    # lookahead is only ever evaluated at the one true anchor position. This
    # regex only exempts that literal target; any other decode call with
    # "Transcript" in its target type still trips the rule.

  telemetry_sql_bypass:
    name: "stage_events/telemetry SQL bypass"
    message: >-
      Write `stage_events` and `telemetry` rows only through
      StageEventLogger.record(event:) / TelemetryRecorder.record(meetingID:
      patch:) — every other caller funnels through those actors (AR-PAT-4),
      which are themselves the only callers of StateStore's typed insert/
      upsert methods. Direct SQL bypasses the single-writer discipline the
      write-authority matrix depends on.
    regex: '(?i)INSERT INTO stage_events|INSERT INTO telemetry'
    # `string`, not `identifier`/`keyword`: the pattern's whole point is text
    # that only ever appears inside a `sql:` string-literal argument
    # (`db.execute(sql: "INSERT INTO telemetry ...")`) — restricting to
    # `string` still excludes a comment merely mentioning the phrase, which
    # `identifier`/`keyword` would too, but unlike those two, `string` still
    # matches the literal the rule exists to catch.
    match_kinds:
      - string
    severity: error
    excluded:
      # StateStore is StageEventLogger's and TelemetryRecorder's sole
      # dependency for reaching SQLite (architecture.md:1968) — the literal
      # INSERT statements live here, not in the two actors that wrap it.
      - ".*/Sources/State/StateStore\\.swift$"
      - ".*/Sources/Telemetry/StageEventLogger\\.swift$"
      - ".*/Sources/Telemetry/TelemetryRecorder\\.swift$"
      # Seeds pre-migration rows via raw SQL to test that a migration
      # backfills them correctly — the test's entire point is bypassing the
      # typed API to construct a pre-migration database state.
      - ".*/Tests/StateTests/MigrationTests\\.swift$"

  composition_root_strategy_bypass:
    name: "Concrete-strategy instantiation outside a composition root"
    message: >-
      Instantiate concrete strategies (the `<Vendor><Concern>` targets —
      ClaudeSummarizer, ClaudeAIReviewers, WhisperKitTranscriber,
      WhisperKitDiarizer, GoogleCalendarSource) only inside a composition
      root: AuricleApp.swift, auricle-cli's entry point, or
      Tests/TestSupport/TestComposition.swift. Everywhere else depends on
      the strategy's interface protocol instead (architecture.md's
      Composition Roots pattern).
    regex: '\b(Claude[A-Z]\w*|WhisperKit[A-Z]\w*|GoogleCalendarSource)(\.init)?\('
    match_kinds:
      - identifier
    severity: error
    excluded:
      - ".*/App/Auricle/AuricleApp\\.swift$"
      - ".*/App/auricle-cli/AuricleCLI\\.swift$"
      # The Decision 3.6 strategy-comparison verb runs both concrete summarizers
      # side by side, so it names them the way a composition root does; its
      # logic lives in Sources/Summarize, which stays strategy-agnostic.
      - ".*/App/auricle-cli/Verbs/StrategyComparisonVerb\\.swift$"
      # The summarize stage's subprocess entry point wires the primary and
      # fallback strategies into SummarizerOrchestrator; the stage logic
      # itself lives in Sources/Summarize, which stays strategy-agnostic.
      - ".*/App/auricle-cli/Verbs/InternalStageWorker\\.swift$"
      # Doesn't exist yet (Package.swift's own comment on the test-helper
      # composition root) — pre-excluded so it needs no lint-config change
      # the day it's added.
      - ".*/Tests/TestSupport/TestComposition\\.swift$"
      # The five concrete-strategy targets' own implementation directories
      # (today just ManifestPlaceholder.swift stubs) — a type's own file
      # instantiating itself isn't a composition-root bypass; only a
      # *caller* reaching past the interface into one of these types is.
      - ".*/Sources/ClaudeSummarizer/.*\\.swift$"
      - ".*/Sources/ClaudeAIReviewers/.*\\.swift$"
      - ".*/Sources/WhisperKitTranscriber/.*\\.swift$"
      - ".*/Sources/WhisperKitDiarizer/.*\\.swift$"
      - ".*/Sources/GoogleCalendarSource/.*\\.swift$"
      # A concrete strategy's own test target constructing it to test it is
      # the same non-bypass as the strategy's own source file doing so above:
      # the caller here is the type's own unit test suite, not a `caller`
      # reaching past `SummarizerStrategy` into the concrete type. Scoped per
      # test target, not blanket — a different concrete strategy's test
      # target needs its own directory added here before it can construct
      # its own type directly; this entry does not cover it.
      - ".*/Tests/ClaudeSummarizerTests/.*\\.swift$"
      # Same non-bypass for GoogleCalendarSource's own unit tests: they
      # construct the actor to exercise it against stubbed Google responders.
      - ".*/Tests/GoogleCalendarSourceTests/.*\\.swift$"
      # CrossModeFixtureTests.swift constructs both ClaudeCitationsSummarizer
      # and ClaudeSubstringSummarizer directly to prove the two grounding
      # strategies agree on offset semantics — the cross-strategy contract
      # test is its own caller, not a composition root, but per-test-target
      # scoping still applies: this entry covers only this test target's own
      # directory, the same as the ClaudeSummarizerTests entry above.
      - ".*/Tests/SummarizeTests/.*\\.swift$"

  accessibility_label_missing:
    name: "Missing accessibilityLabel"
    message: >-
      Set accessibilityLabel on every interactive control per UX-DR65 /
      NFR-A1 — VoiceOver has nothing else to read for this control. This is
      a best-effort, line-level check with a real false-negative rate (e.g.
      a label applied several lines below the control); it cannot see
      SwiftUI's modifier-chain structure, only nearby text.
    regex: '\b(Button|Toggle|TextField)\((?![\s\S]{0,300}?\.accessibilityLabel\()'
    match_kinds:
      - identifier
    severity: error
